name: Sync upstream and rebuild Quick Chain Windows

on:
  schedule:
    # GitHub schedules use UTC; runs daily and may be delayed under load.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync-quick-chain
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fork main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Merge upstream into fork main, then custom branch
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/chen08209/FlClash.git
          git fetch --no-tags upstream main
          git fetch --no-tags origin main quick-chain
          git checkout -B main origin/main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork main is already up to date."
          else
            # Intentional ordinary merge: conflicts FAIL; never silently drop
            # fork customizations or overwrite files with -X ours.
            git merge --no-ff --no-edit upstream/main
            git push origin HEAD:main
          fi

          git checkout -B quick-chain origin/quick-chain
          if git merge-base --is-ancestor main HEAD; then
            echo "Quick Chain already contains current fork main."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git merge --no-ff --no-edit main
            git push origin HEAD:quick-chain
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release for new upstream commit
        if: steps.merge.outputs.updated == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub intentionally ignores workflow pushes by GITHUB_TOKEN.
          # Explicit workflow_dispatch ensures the new commit gets built.
          gh workflow run quick-chain-windows.yml --repo ${{ github.repository }} --ref quick-chain
          echo "Triggered Windows build for updated Quick Chain."
